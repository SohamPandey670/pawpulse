server:
  port: ${PORT:8080}

spring:
  application:
    name: pawpulse-api

  # Default profile uses H2 for easy local development
  datasource:
    url: jdbc:h2:mem:pawpulse
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: PawPulseSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024!
  expiration: 86400000  # 24 hours in milliseconds

# CORS
cors:
  allowed-origins: "*"

---
# Production profile for PostgreSQL (Railway)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never
